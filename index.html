<!DOCTYPE html>
<html>
  <head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css" type="text/css">
  </head>
  <body>
    <input id="mode" type="hidden" value="0">
    <h2 id="formName">安全大会2026 出席QRカメラ</h2>
    <!-- <table width=100%>
      <tr><td class="txt_r">
          <input id="modeButton" type="button" onclick="onClickMode();" value="番号入力を表示">
      </td></tr>
    </table> -->

    <table id="infoMsg" class="table-left" width=100%>
      <tr>
        <td><a id="scanMsg">こちらに読み取り結果が表示されます</a></td>
      </tr>
    </table>

    <table id="inputTable" class="table-noBorder">
      <tr>
        <td colspan="8">以下に受付番号（7桁）を入力して【検索】</td>
      </tr>
      <tr>
        <td class="txt_c"><input type="tel" maxlength="1" id="input1" name="inputId" class="txt_c input_no" onkeyup="nextfeild(this)" onfocus="this.select();"/></td>
        <td class="txt_c"><input type="tel" maxlength="1" id="input2" name="inputId" class="txt_c input_no" onkeyup="nextfeild(this)" onfocus="this.select();"/></td>
        <td class="txt_c"><input type="tel" maxlength="1" id="input3" name="inputId" class="txt_c input_no" onkeyup="nextfeild(this)" onfocus="this.select();"/></td>
        <td class="txt_c"><input type="tel" maxlength="1" id="input4" name="inputId" class="txt_c input_no" onkeyup="nextfeild(this)" onfocus="this.select();"/></td>
        <td class="txt_c"><input type="tel" maxlength="1" id="input5" name="inputId" class="txt_c input_no" onkeyup="nextfeild(this)" onfocus="this.select();"/></td>
        <td class="txt_c">-</td>
        <td class="txt_c"><input type="tel" maxlength="1" id="input6" name="inputId" class="txt_c input_no" onkeyup="nextfeild(this)" onfocus="this.select();"/></td>
        <td class="txt_c"><input type="tel" maxlength="1" id="input7" name="inputId" class="txt_c input_no" onkeyup="nextfeild(this)" onfocus="this.select();"/></td>
      </tr>
      <tr>
        <td class="txt_r" colspan="8">
          <input id="sendButton" type="button" class="fs_btn" onclick="();" value="検索">
        </td>
      </tr>
    </table>

    <div id="reader" style="width:75%;">
      <input type="file" id="file-picker">
    </div>

    <br>
    <table id="inputUsedMsg" width=100%>
      <tr><td>
          ●使い方<br>
          1.参加者の[受付番号（7桁）]を入力<br>
          2.【検索】ボタンをクリック<br>
          3.【出席】ボタンをクリック<br>
          4.「～出席しました」が表示されたら完了<br>
      </td></tr>
    </table>
    <table id="cameraUsedMsg" width=100%>
      <tr><td>
          ●使い方<br>
          1.【Request Camera Permissions】をクリック<br>
          2.カメラの使用を許可する<br>
          3.【Start Scanning】をクリック<br>
          4.参加者の[出席QRコード]をスキャンする<br>
          5.【出席】ボタンをクリック<br>
          6.「～出席しました」が表示されたら完了<br>
      </td></tr>
    </table>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <script>
      
      onClickMode();

      // 入力モードの変更処理
      function onClickMode(){
        // const doc_modeButton = document.getElementById('modeButton');
        const doc_mode = document.getElementById('mode');
        const doc_inputTable = document.getElementById('inputTable');
        const doc_reader = document.getElementById('reader');
        const doc_inputUsed = document.getElementById('inputUsedMsg');
        const doc_cameraUsed = document.getElementById('cameraUsedMsg');
        const mode = doc_mode.value;
        if (mode == 1){
          // 番号入力モードに切り替え
          // console.log("番号入力モード");

          // doc_modeButton.value = "QRカメラを表示";
          doc_inputTable.style.display = "block";
          doc_reader.style.display = "none";
          doc_mode.value = 0;
          doc_inputUsed.style.display = "block";
          doc_cameraUsed.style.display = "none";

        } else {
          // QRカメラモードに切り替え
          // console.log("QRカメラモード");

          // doc_modeButton.value = "番号入力を表示";
          doc_inputTable.style.display = "none";
          doc_reader.style.display = "block";
          doc_mode.value = 1;
          doc_inputUsed.style.display = "none";
          doc_cameraUsed.style.display = "block";
        }
      }

      // 文字入力後、フォーカスを変更する処理
      function nextfeild(str) {
        if (str.value.length >= 1) {
          for (var i = 0, elm = document.getElementsByName('inputId'); i < elm.length; i++) {
            if (elm[i] == str) {
              (elm[i + 1] || elm[elm.length-1]).focus();
              break;
            }
          }
        }
        return (str);
      }

      // スキャン実行フラグ
      var SCAN_FLG = false;
      // 前回読取したQR
      var SCAN_TEXT = '';
      // 出欠WebAPIのURL
      let API_URL = "https://script.google.com/macros/s/AKfycbzSYxTJurlL23vxix3iizEYRwSQ1M-u3qnvc0jGbuKDf8Z7605f4wPRFOjYnmo5lRu2/exec";

      let QRresult = document.querySelector('#scanMsg');

      // 画面にappendの内容を表示
      const append = (decodedText) => {
        QRresult.innerHTML = `${decodedText}`; 
      };

      // （「reader」にQRリーダーを表示）
      let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 50, qrbox: 250});
      // スキャン時
      const onScanSuccess = (decodedText) => {
        onCodeSerch(decodedText);
      };

      html5QrcodeScanner.render(onScanSuccess);
      
      function onCodeSerch(search_text){
        if (!SCAN_FLG) {
          // 前回と同じQRは読取しない
          if (SCAN_TEXT == search_text){return;}

          SCAN_FLG = true;
          SCAN_TEXT = search_text;
          
          onClickScan(search_text);
        }
      }

      // スキャン時処理
      function onClickScan(scanText){
        append("検索中・・・");

        // API側で【スキャン】時の処理を実行
        const xhr = new XMLHttpRequest();
        xhr.open("GET", API_URL + "?mode=scan&scanText="+scanText);
        xhr.send();
        xhr.responseType = "json";
        xhr.onload = () => {
          if (xhr.readyState == 4 && xhr.status == 200) {
            const data = xhr.response;
            append(data.retAppendText);
            SCAN_FLG = false;
          } else {
            append(`Error: ${xhr.status}`);
            SCAN_FLG = false;
          }
        };
      }

      // 【出席】ボタン押下時処理
      function onClickEntry(scanCompKbn, scanCompId, scanUserId, scanAnsDate, row_comp){
        SCAN_FLG = true;
        append(`出席処理中・・・`);

        // API側で【出席】時の処理を実行
        const xhr = new XMLHttpRequest();
        xhr.open("GET", API_URL + "?mode=entry&compKbn="+scanCompKbn+"&compId="+scanCompId+"&userId="+scanUserId+"&ansDate="+scanAnsDate+"&compRow="+row_comp);
        xhr.send();
        xhr.responseType = "json";
        xhr.onload = () => {
          if (xhr.readyState == 4 && xhr.status == 200) {
            const data = xhr.response;
            append(data.retAppendText);
            SCAN_FLG = false;

          } else {
            append(`Error: ${xhr.status}`);
            SCAN_FLG = false;
          }
        };
      }
      
    </script>
  </body>
</html>
